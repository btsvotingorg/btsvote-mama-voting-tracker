
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BTS Vote Project | Certificate Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@6/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #faf8fd;
      color: #30243d;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      max-width: 560px;
      margin: 50px auto;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e9e1f1;
      border-radius: 16px;
      padding: 28px;
    }

    .brand {
      color: #7651a8;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h1 {
      font-size: 26px;
      line-height: 1.3;
      margin: 18px 0 10px;
    }

    p {
      color: #777080;
      font-size: 14px;
      line-height: 1.7;
    }

    label {
      display: block;
      margin-top: 22px;
      font-size: 14px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      border: 1px solid #ddd3e8;
      border-radius: 8px;
      background: white;
      color: #30243d;
      font-size: 14px;
    }

    input:focus,
    select:focus {
      outline: 2px solid #a98bd1;
      outline-offset: 1px;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #7651a8;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #submitButton {
      background: #46315f;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      background: #f4eef9;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .notice {
      margin-top: 20px;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="container">
    <div class="card">

      <div class="brand">BTS VOTE PROJECT</div>

      <h1>MAMA 2026 Certificate Scanner</h1>

      <p>
        Test certificate scanning and submission before
        activating the public voting tracker.
      </p>

      <label for="username">X Username</label>

      <input
        type="text"
        id="username"
        placeholder="@yourusername"
        maxlength="16"
        autocomplete="off"
      >

      <label for="country">Country</label>

      <select id="country" required>
        <option value="">Select your country</option>
      </select>

      <label for="certificate">
        Voting Certificate Screenshot
      </label>

      <input
        type="file"
        id="certificate"
        accept="image/png,image/jpeg,image/webp"
      >

      <button id="scanButton" type="button">
        SCAN CERTIFICATE
      </button>

      <button id="submitButton" type="button" disabled>
        SUBMIT TEST PROOF
      </button>

      <div
        id="result"
        role="status"
        aria-live="polite"
      ></div>

      <p class="notice">
        Testing only. Successful submissions are stored
        as pending and are not counted on the public leaderboard.
        OCR detection does not authenticate a certificate.
      </p>

    </div>
  </main>

  <script>
    const SUPABASE_URL =
      "https://vnhvyhfkvvqnlghikgck.supabase.co";

    // Public publishable key. Never use a service-role key here.
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_TmHSZ9xy4DzbzpdDte3E2g_RtSk6KfI";

    const fileInput = document.getElementById("certificate");
    const usernameInput = document.getElementById("username");
    const countryInput = document.getElementById("country");
    const scanButton = document.getElementById("scanButton");
    const submitButton = document.getElementById("submitButton");
    const resultBox = document.getElementById("result");

    let detectedCertificateNumber = null;
    let scannedFile = null;

    // Build alphabetical country and territory dropdown.
    const regionNames = new Intl.DisplayNames(["en"], {
      type: "region"
    });

    const countries = [];

    for (let a = 65; a <= 90; a++) {
      for (let b = 65; b <= 90; b++) {
        const code = String.fromCharCode(a, b);
        const name = regionNames.of(code);

        if (name && name !== code) {
          countries.push({ code, name });
        }
      }
    }

    countries.sort((a, b) =>
      a.name.localeCompare(b.name)
    );

    
const countries = [
  "Afghanistan", "Albania", "Algeria", "Andorra", "Angola",
  "Antigua and Barbuda", "Argentina", "Armenia", "Australia",
  "Austria", "Azerbaijan", "Bahamas", "Bahrain", "Bangladesh",
  "Barbados", "Belarus", "Belgium", "Belize", "Benin", "Bhutan",
  "Bolivia", "Bosnia and Herzegovina", "Botswana", "Brazil",
  "Brunei", "Bulgaria", "Burkina Faso", "Burundi", "Cabo Verde",
  "Cambodia", "Cameroon", "Canada", "Central African Republic",
  "Chad", "Chile", "China", "Colombia", "Comoros", "Congo",
  "Costa Rica", "Côte d'Ivoire", "Croatia", "Cuba", "Cyprus",
  "Czechia", "Democratic Republic of the Congo", "Denmark",
  "Djibouti", "Dominica", "Dominican Republic", "Ecuador",
  "Egypt", "El Salvador", "Equatorial Guinea", "Eritrea",
  "Estonia", "Eswatini", "Ethiopia", "Fiji", "Finland",
  "France", "Gabon", "Gambia", "Georgia", "Germany", "Ghana",
  "Greece", "Grenada", "Guatemala", "Guinea", "Guinea-Bissau",
  "Guyana", "Haiti", "Honduras", "Hungary", "Iceland", "India",
  "Indonesia", "Iran", "Iraq", "Ireland", "Israel", "Italy",
  "Jamaica", "Japan", "Jordan", "Kazakhstan", "Kenya",
  "Kiribati", "Kuwait", "Kyrgyzstan", "Laos", "Latvia",
  "Lebanon", "Lesotho", "Liberia", "Libya", "Liechtenstein",
  "Lithuania", "Luxembourg", "Madagascar", "Malawi",
  "Malaysia", "Maldives", "Mali", "Malta", "Marshall Islands",
  "Mauritania", "Mauritius", "Mexico", "Micronesia", "Moldova",
  "Monaco", "Mongolia", "Montenegro", "Morocco", "Mozambique",
  "Myanmar", "Namibia", "Nauru", "Nepal", "Netherlands",
  "New Zealand", "Nicaragua", "Niger", "Nigeria",
  "North Korea", "North Macedonia", "Norway", "Oman",
  "Pakistan", "Palau", "Palestine", "Panama",
  "Papua New Guinea", "Paraguay", "Peru", "Philippines",
  "Poland", "Portugal", "Qatar", "Romania", "Russia",
  "Rwanda", "Saint Kitts and Nevis", "Saint Lucia",
  "Saint Vincent and the Grenadines", "Samoa", "San Marino",
  "São Tomé and Príncipe", "Saudi Arabia", "Senegal",
  "Serbia", "Seychelles", "Sierra Leone", "Singapore",
  "Slovakia", "Slovenia", "Solomon Islands", "Somalia",
  "South Africa", "South Korea", "South Sudan", "Spain",
  "Sri Lanka", "Sudan", "Suriname", "Sweden", "Switzerland",
  "Syria", "Taiwan", "Tajikistan", "Tanzania", "Thailand",
  "Timor-Leste", "Togo", "Tonga", "Trinidad and Tobago",
  "Tunisia", "Türkiye", "Turkmenistan", "Tuvalu", "Uganda",
  "Ukraine", "United Arab Emirates", "United Kingdom",
  "United States", "Uruguay", "Uzbekistan", "Vanuatu",
  "Vatican City", "Venezuela", "Vietnam", "Yemen",
  "Zambia", "Zimbabwe"
];

countries.sort((a, b) => a.localeCompare(b));

for (const country of countries) {
  const option = document.createElement("option");
  option.value = country;
  option.textContent = country;
  countryInput.appendChild(option);
}

    function showResult(message) {
      resultBox.style.display = "block";
      resultBox.textContent = message;
    }

    function resetScan() {
      detectedCertificateNumber = null;
      scannedFile = null;
      submitButton.disabled = true;
    }

    fileInput.addEventListener("change", resetScan);

    scanButton.addEventListener("click", async () => {
      resetScan();

      const file = fileInput.files[0];

      if (!file) {
        showResult("Please select a certificate screenshot.");
        return;
      }

      const allowedTypes = [
        "image/png",
        "image/jpeg",
        "image/webp"
      ];

      if (!allowedTypes.includes(file.type)) {
        showResult("Please upload a JPG, PNG, or WEBP image.");
        return;
      }

      if (
        file.size === 0 ||
        file.size > 5 * 1024 * 1024
      ) {
        showResult("The screenshot must be 5 MB or smaller.");
        return;
      }

      if (typeof Tesseract === "undefined") {
        showResult(
          "OCR library failed to load. Check your connection."
        );
        return;
      }

      scanButton.disabled = true;
      scanButton.textContent = "SCANNING...";

      try {
        showResult(
          "Reading your certificate...\n" +
          "The first scan may take a little longer."
        );

        const result = await Tesseract.recognize(
          file,
          "eng"
        );

        const extractedText = result.data.text;

        const match = extractedText.match(
          /\bNo\.?\s*[:#-]?\s*([A-Z0-9]{12,24})\b/i
        );

        if (!match) {
          showResult(
            "Certificate number not detected.\n\n" +
            "Please try a clearer screenshot."
          );
          return;
        }

        detectedCertificateNumber =
          match[1].toUpperCase();

        scannedFile = file;
        submitButton.disabled = false;

        showResult(
          "CERTIFICATE NUMBER DETECTED!\n\n" +
          "Reference Number:\n" +
          detectedCertificateNumber +
          "\n\nYou can now submit this test proof."
        );

      } catch (error) {
        console.error("OCR error:", error);

        showResult(
          "Scanning failed. Please try again."
        );

      } finally {
        scanButton.disabled = false;
        scanButton.textContent = "SCAN CERTIFICATE";
      }
    });

    submitButton.addEventListener("click", async () => {
      const username = usernameInput.value
        .trim()
        .replace(/^@/, "");

      const country = countryInput.value;

      if (!/^[A-Za-z0-9_]{1,15}$/.test(username)) {
        showResult("Please enter a valid X username.");
        return;
      }

      if (!country) {
        showResult("Please select your country.");
        return;
      }

      if (!detectedCertificateNumber || !scannedFile) {
        showResult("Please scan your certificate first.");
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "SUBMITTING...";

      try {
        const form = new FormData();

        form.append("x_username", username);
        form.append("country", country);
        form.append(
          "certificate_number",
          detectedCertificateNumber
        );
        form.append("proof", scannedFile);

        const response = await fetch(
          SUPABASE_URL + "/functions/v1/submit-proof-test",
          {
            method: "POST",
            headers: {
              "apikey": SUPABASE_PUBLISHABLE_KEY
            },
            body: form
          }
        );

        const data = await response.json();

        if (response.status === 401) {
          showResult(
            "Authentication blocked the request.\n\n" +
            "The function's JWT verification setting " +
            "may need adjustment after adding public-access safeguards."
          );
          return;
        }

        if (response.status === 409 && data.duplicate) {
          showResult(
            "DUPLICATE CERTIFICATE\n\n" +
            "This certificate has already been submitted."
          );
          return;
        }

        if (!response.ok) {
          showResult(
            "Submission failed:\n" +
            (data.error || data.message || "Unknown error.")
          );
          return;
        }

        showResult(
          "TEST SUBMISSION SUCCESSFUL!\n\n" +
          "Certificate: " +
          detectedCertificateNumber +
          "\nStatus: PENDING\n\n" +
          "Your proof was saved but has not been counted."
        );

        resetScan();

      } catch (error) {
        console.error("Submission error:", error);

        showResult(
          "Could not connect to Supabase.\n" +
          "Please check your internet connection."
        );

      } finally {
        submitButton.textContent = "SUBMIT TEST PROOF";
      }
    });
  </script>

</body>
</html>
