<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BTS Vote Project | Certificate Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@6/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #faf8fd;
      color: #30243d;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      max-width: 560px;
      margin: 60px auto;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e9e1f1;
      border-radius: 16px;
      padding: 28px;
    }

    .brand {
      color: #7651a8;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h1 {
      font-size: 26px;
      line-height: 1.3;
      margin: 18px 0 10px;
    }

    p {
      color: #777080;
      font-size: 14px;
      line-height: 1.7;
    }

    label {
      display: block;
      margin-top: 24px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      margin: 12px 0;
      padding: 12px;
      border: 1px solid #ddd3e8;
      border-radius: 8px;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #7651a8;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      background: #f4eef9;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .notice {
      margin-top: 20px;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="container">
    <div class="card">

      <div class="brand">BTS VOTE PROJECT</div>

      <h1>MAMA 2026 Certificate Scanner</h1>

      <p>
        Upload a MAMA 2026 voting certificate to test
        automatic reference number detection.
      </p>

      <label for="certificate">
        Voting Certificate Screenshot
      </label>

      <input
        type="file"
        id="certificate"
        accept="image/png,image/jpeg,image/webp"
      >

      <button id="scanButton" type="button">
        SCAN CERTIFICATE
      </button>

      <div id="result" role="status" aria-live="polite"></div>

      <p class="notice">
        Testing only. This scanner runs in your browser.
        It does not submit screenshots, count votes,
        or update the country leaderboard.
      </p>

    </div>
  </main>

  <script>
    const fileInput = document.getElementById("certificate");
    const button = document.getElementById("scanButton");
    const resultBox = document.getElementById("result");

    function showResult(message) {
      resultBox.style.display = "block";
      resultBox.textContent = message;
    }

    button.addEventListener("click", async () => {
      const file = fileInput.files[0];

      if (!file) {
        showResult("Please select a certificate screenshot.");
        return;
      }

      const allowedTypes = [
        "image/png",
        "image/jpeg",
        "image/webp"
      ];

      if (!allowedTypes.includes(file.type)) {
        showResult("Please upload a JPG, PNG, or WEBP image.");
        return;
      }

      if (file.size > 5 * 1024 * 1024) {
        showResult("The screenshot must be 5 MB or smaller.");
        return;
      }

      if (typeof Tesseract === "undefined") {
        showResult(
          "OCR library failed to load. Check your internet connection."
        );
        return;
      }

      button.disabled = true;
      button.textContent = "SCANNING...";

      try {
        showResult(
          "Reading your certificate...\n" +
          "The first scan may take a little longer."
        );

        const result = await Tesseract.recognize(
          file,
          "eng"
        );

        const extractedText = result.data.text;

        // Find the reference number after "No."
        const match = extractedText.match(
          /\bNo\.?\s*[:#-]?\s*([A-Z0-9]{12,24})\b/i
        );

        if (match) {
          const certificateNumber = match[1].toUpperCase();

          showResult(
            "CERTIFICATE NUMBER DETECTED!\n\n" +
            "Reference Number:\n" +
            certificateNumber +
            "\n\nThis is an OCR test only."
          );
        } else {
          showResult(
            "Certificate number not detected.\n\n" +
            "OCR text for troubleshooting:\n\n" +
            extractedText
          );
        }

      } catch (error) {
        console.error("OCR error:", error);

        showResult(
          "Scanning failed:\n" + error.message
        );

      } finally {
        button.disabled = false;
        button.textContent = "SCAN CERTIFICATE";
      }
    });
  </script>

</body>
</html>
