
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAMA 2026 | Certificate Scanner Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #faf8fd;
      color: #30243d;
    }

    .container {
      max-width: 560px;
      margin: 70px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border: 1px solid #e9e1f1;
      border-radius: 16px;
      padding: 30px;
    }

    .brand {
      color: #7651a8;
      font-size: 12px;
      letter-spacing: 2px;
      font-weight: bold;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    p {
      color: #777080;
      font-size: 14px;
      line-height: 1.7;
    }

    input {
      width: 100%;
      margin: 15px 0;
      padding: 12px;
      border: 1px solid #ddd3e8;
      border-radius: 8px;
    }

    button {
      width: 100%;
      background: #7651a8;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #f4eef9;
      font-size: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      display: none;
    }

    .notice {
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="card">
      <div class="brand">BTS VOTE PROJECT</div>

      <h1>MAMA 2026 Certificate Scanner</h1>

      <p>
        Upload a MAMA 2026 voting certificate to test
        automatic reference number detection.
      </p>

      <label for="certificate">Voting Certificate Screenshot</label>

      <input
        type="file"
        id="certificate"
        accept="image/png,image/jpeg,image/webp"
      >

      <button id="scanButton" type="button">
        SCAN CERTIFICATE
      </button>

      <div id="result" role="status" aria-live="polite"></div>

      <p class="notice">
        Testing only. This page does not count votes,
        approve submissions, or update the leaderboard.
        Do not upload sensitive or private screenshots.
      </p>
    </div>
  </main>

  <script>
    const FUNCTION_URL =
      "https://vnhvyhfkvvqnlghikgck.supabase.co/functions/v1/scan-certificate-test";

    const PUBLISHABLE_KEY =
      "sb_publishable_TmHSZ9xy4DzbzpdDte3E2g_RtSk6KfI";

    const fileInput = document.getElementById("certificate");
    const button = document.getElementById("scanButton");
    const resultBox = document.getElementById("result");

    function showResult(message) {
      resultBox.style.display = "block";
      resultBox.textContent = message;
    }

    button.addEventListener("click", async () => {
      const file = fileInput.files[0];

      if (!file) {
        showResult("Please select a certificate screenshot first.");
        return;
      }

      const allowedTypes = [
        "image/png",
        "image/jpeg",
        "image/webp"
      ];

      if (!allowedTypes.includes(file.type)) {
        showResult("Please upload a JPG, PNG, or WEBP image.");
        return;
      }

      if (file.size > 5 * 1024 * 1024) {
        showResult("Image must be 5 MB or smaller.");
        return;
      }

      button.disabled = true;
      button.textContent = "SCANNING...";
      showResult("Scanning certificate. Please wait...");

      try {
        const formData = new FormData();
        formData.append("proof", file);

        const response = await fetch(FUNCTION_URL, {
          method: "POST",
          headers: {
            "apikey": PUBLISHABLE_KEY,
            "Authorization": "Bearer " + PUBLISHABLE_KEY
          },
          body: formData
        });

        const text = await response.text();

        let data;

        try {
          data = JSON.parse(text);
        } catch {
          throw new Error(
            "The server did not return a valid JSON response."
          );
        }

        if (!response.ok) {
          throw new Error(
            data.error || "Request failed: " + response.status
          );
        }

        if (data.certificate_number) {
          showResult(
            "CERTIFICATE DETECTED!\n\n" +
            "Reference Number:\n" +
            data.certificate_number
          );
        } else {
          showResult(
            data.message ||
            "The certificate number could not be detected."
          );
        }

      } catch (error) {
        console.error(error);

        showResult(
          "Scanner error:\n" + error.message +
          "\n\nCheck the function logs in Supabase."
        );
      } finally {
        button.disabled = false;
        button.textContent = "SCAN CERTIFICATE";
      }
    });
  </script>
</body>
</html>
